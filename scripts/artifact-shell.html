<title>GUR Önizleme</title>
<!-- GÖRÜNTÜ ALANI. Bu satır yoktu ve eksikliği artifact telefonda
     açıldığında görünüyordu: viewport meta'sı olmayan sayfaya tarayıcı
     980 px'lik sanal bir genişlik veriyor, dolayısıyla matchMedia
     "(min-width: 900px)" EŞLEŞİYOR ve `/` telefonda uygulama yerine
     tanıtım sayfasını açıyordu (ölçüldü). viewport-fit=cover ise
     env(safe-area-inset-*) değerlerinin dönmesi için gerekli —
     index.html'deki satırın aynısı. -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<!-- Fontlar bloke etmeden yüklenir: yavaş bir stil sayfası modül scriptinin
     çalışmasını da geciktirip sayfayı boş bırakıyor. -->
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&family=Outfit:wght@400;500;600;700;800&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&family=Outfit:wght@400;500;600;700;800&display=swap" /></noscript>
<style>
  /* Tek temaya bilinçli olarak bağlı: uygulama koyu zemin + GUR turuncusu
     üzerine tasarlandı, telefon çerçevesi bu zeminde duruyor. */
  :root { --gur-bg: #0d0d1a; --gur-ink: rgba(255,255,255,0.7); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: var(--gur-bg); }
  body { font-family: 'Outfit', system-ui, sans-serif; min-height: 100vh; color: var(--gur-ink); }
  #root { min-height: 100vh; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 999px; }
  .gur-preview-note {
    position: fixed; right: 12px; bottom: 12px; z-index: 99999; max-width: 230px;
    padding: 9px 13px; border-radius: 12px;
    background: rgba(13,13,26,0.75); backdrop-filter: blur(6px);
    border: 1px solid rgba(255,255,255,0.08);
    color: rgba(255,255,255,0.65); font-size: 11px; line-height: 1.45;
    pointer-events: none;
  }
  @media (prefers-reduced-motion: reduce) { * { animation-duration: 0.01ms !important; } }
</style>
<div id="root"></div>
<div class="gur-preview-note">Önizleme YEREL modda çalışır: arkasında sunucu yok, yazdıklarınız yalnızca bu tarayıcıda kalır. Tam sistem için depodaki server/ kurulur. Sol üstten Yönetici paneline geçebilirsiniz.</div>
