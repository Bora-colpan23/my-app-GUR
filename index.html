<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: env(safe-area-inset-*) ancak bununla değer döner -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>GUR — Restoran Keşif Platformu</title>
    <meta name="description" content="GUR, İstanbul'da restoran keşfetmenin en hızlı yolu: kaydır, beğen, Gastro Onaylı mekanları keşfet." />
    <meta name="theme-color" content="#0d0d1a" />
    <!-- Google Search Console doğrulaması: mülkü oluşturduktan sonra "HTML
         etiketi" yöntemiyle verilen içeriği aşağıya yazıp yorumu kaldırın.
         Alternatifi DNS TXT kaydıdır ve alan adı sizdeyse o daha sağlamdır. -->
    <!-- <meta name="google-site-verification" content="BURAYA_DOGRULAMA_KODU" /> -->
    <meta name="color-scheme" content="light dark" />
    <!-- Uygulama ikonu: turuncu GUR marka pili. Satır içi SVG favicon
         masaüstü tarayıcılarda, PNG ise iOS ana ekran kısayolunda kullanılır. -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%23FF6600'/%3E%3Ctext x='32' y='42.5' font-family='Poppins,Helvetica,Arial,sans-serif' font-size='23' font-weight='800' fill='%23ffffff' text-anchor='middle'%3EGUR%3C/text%3E%3C/svg%3E" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fontlar bloke etmeden yüklenir: normal bir <link rel="stylesheet">
         yavaş/erişilemez olduğunda modül scriptinin çalışmasını da geciktirip
         uygulamayı bomboş bırakıyor. Bu yolla Poppins gelene kadar sistem
         yazı tipiyle açılır. -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" /></noscript>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { font-family: 'Poppins', system-ui, sans-serif; background: #0d0d1a; }
      #root { min-height: 100vh; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
