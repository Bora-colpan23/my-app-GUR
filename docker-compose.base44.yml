# Base44 dev environment for GUR
# Fullstack: React+Vite frontend (5173) + Node.js API (8787) + PostgreSQL
# Single-origin: Vite proxies /api to the backend, only port 3000 is public.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: gur
      POSTGRES_PASSWORD: gur_dev
      POSTGRES_DB: gur
    volumes:
      - ./server/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gur -d gur"]
      interval: 3s
      timeout: 3s
      retries: 20

  db-setup:
    image: node:22
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      - DATABASE_URL=postgres://gur:gur_dev@postgres:5432/gur
      - DISABLE_CRON=1
      - ADMIN_USER=admin
      - ADMIN_PASSWORD=gur2026
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npm install && node server/db/seed.js"

  api:
    image: node:22
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      - DATABASE_URL=postgres://gur:gur_dev@postgres:5432/gur
      - PORT=8787
      - CORS_ORIGIN=*
      - ADMIN_USER=admin
      - ADMIN_PASSWORD=gur2026
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    depends_on:
      postgres:
        condition: service_healthy
      db-setup:
        condition: service_completed_successfully
    command: sh -c "npm install && node server/index.js"

  web:
    image: node:22
    working_dir: /app
    ports:
      - "3000:5173"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      - VITE_API_TARGET=http://api:8787
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    depends_on:
      - api
    command: sh -c "npm install && npx vite --host 0.0.0.0 --port 5173"

volumes:
  pgdata:
  node_modules:
