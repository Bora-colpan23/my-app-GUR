# Şema değişince Supabase'e otomatik uygular (yalnızca main + elle tetikleme).
# Gizli anahtarlar tanımlı DEĞİLSE hiçbir şey yapmadan başarıyla biter:
#   Settings → Secrets and variables → Actions →
#     SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF
# Betik idempotent: uygulanmış migration atlanır. Bu iş akışı GitHub'da DENENMEDİ.
name: Supabase şema

on:
  push:
    branches: [main]
    paths: ['supabase/**', 'scripts/supabase-kur.mjs']
  workflow_dispatch:

jobs:
  kur:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Migration'ları uygula
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "Supabase gizli anahtarları tanımlı değil; atlandı."
            exit 0
          fi
          node scripts/supabase-kur.mjs
